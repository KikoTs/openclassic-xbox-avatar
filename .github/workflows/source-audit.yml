name: Source boundary audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary or generated files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E -i '(^|/)(CastleMinerZ\.exe|DNA\.Common\.dll)$|\.(ocavatar|winmd|exe|dll|pdb|lib|exp|obj)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden files are tracked:"
            echo "$forbidden"
            exit 1
          fi
